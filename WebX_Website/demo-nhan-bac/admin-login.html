<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập Quản Trị Viên | KaT Jewelry</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #082035 0%, #0f3d62 50%, #082035 100%);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div style="text-align:center; margin-bottom:28px;">
        <a href="index.html" class="logo-wrap" style="align-items:center;">
          <span class="logo-text" style="font-size:28px;">KaT JEWELRY</span>
          <span class="logo-tagline">Hệ Thống Quản Trị Admin</span>
        </a>
        <p style="font-size:13.5px; color:var(--text-muted); margin-top:8px;">
          Đăng nhập để quản lý đơn hàng, doanh thu và sản phẩm
        </p>
      </div>

      <div style="background:var(--primary-subtle); border:1px solid #b8daf0; border-radius:10px; padding:14px; margin-bottom:24px; font-size:13px; color:#1e3a5f;">
        <div style="font-weight:700; margin-bottom:4px;">🔑 Tài khoản thử nghiệm có sẵn:</div>
        <div>Email: <strong style="color:var(--primary);">admin@katjewelry.vn</strong></div>
        <div>Mật khẩu: <strong style="color:var(--primary);">Admin@123456</strong></div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Quản Trị *</label>
          <input type="email" id="loginEmail" class="form-control" value="admin@katjewelry.vn" required />
        </div>
        <div class="form-group">
          <label class="form-label">Mật khẩu *</label>
          <input type="password" id="loginPassword" class="form-control" value="Admin@123456" required />
        </div>

        <button type="submit" id="loginBtn" class="btn-primary-blue" style="width:100%; padding:13px; font-size:15px; font-weight:700; border-radius:10px; margin-top:10px;">
          ĐĂNG NHẬP VÀO HỆ THỐNG ↗
        </button>
      </form>

      <div style="text-align:center; margin-top:20px;">
        <a href="index.html" style="font-size:13px; color:var(--primary); font-weight:600;">← Về trang chủ mua sắm (Không cần đăng nhập)</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://127.0.0.1:8000/api' : '/api';

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Đang xác thực...';
      btn.disabled = true;

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (data.status === 'success' && data.data?.token) {
          localStorage.setItem('kat_admin_token', data.data.token);
          localStorage.setItem('kat_admin_info', JSON.stringify(data.data.admin));
          window.location.href = 'admin.html';
        } else {
          alert('❌ ' + (data.message || 'Đăng nhập thất bại'));
          btn.textContent = 'ĐĂNG NHẬP VÀO HỆ THỐNG ↗';
          btn.disabled = false;
        }
      } catch(err) {
        console.error(err);
        alert('Không thể kết nối đến máy chủ Backend Laravel. Hãy đảm bảo máy chủ đang chạy tại port 8000.');
        btn.textContent = 'ĐĂNG NHẬP VÀO HỆ THỐNG ↗';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
